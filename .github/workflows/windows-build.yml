name: windows-build

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - ".github/workflows/windows-build.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Pub get
        working-directory: app
        run: flutter pub get

      - name: Build Windows
        working-directory: app
        run: flutter build windows --release

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path app/build/windows/x64/runner/Release/* -DestinationPath watch-together-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: watch-together-windows-x64
          path: watch-together-windows-x64.zip
          retention-days: 14
