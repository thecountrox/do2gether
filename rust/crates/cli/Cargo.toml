[package]
name = "wt-cli"
description = "wt-play: joins a room and keeps an mpv (or simulated) player on the room anchor"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "wt-play"
path = "src/main.rs"

[dependencies]
wt-protocol.workspace = true
tokio = { workspace = true, features = ["io-util", "process", "signal"] }
serde_json.workspace = true
sha2.workspace = true
# Same versions the server's tests already use.
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# TLS for https/wss: the crates tokio-tungstenite's rustls feature pulls in anyway, named directly so
# `POST /rooms` shares the same stack. `ring` is the crypto provider (lighter build than aws-lc-rs).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
tokio-rustls = { version = "0.26", default-features = false }

[dev-dependencies]
# The server's test harness (tests/support) is reused for the in-process server and the schema
# validator; these are its dependencies.
wt-server = { path = "../server" }
axum.workspace = true
serde.workspace = true
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
